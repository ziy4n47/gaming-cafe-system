<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gaming Café — Floor</title>

<!-- Fonts: a characterful display face, a mono for codes/timers -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  /* ---------- design tokens ---------- */
  :root {
    --bg: #0d1017;
    --surface: #161b26;
    --surface-2: #1e2533;
    --line: #2a3242;
    --text: #e6ebf4;
    --muted: #8b95a7;
    --free: #34d399;   /* calm teal-green = available */
    --busy: #f5a742;   /* warm amber = in use       */
    --accent: #5b8dff; /* interactive / brand        */
    --danger: #f0685f;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: "JetBrains Mono", monospace; }

  /* ---------- login ---------- */
  #login-view {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 28px;
  }
  .brand {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }
  .brand .dot { color: var(--accent); }
  .login-sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  input[type=email], input[type=password], input[type=text] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    padding: 11px 12px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 600;
    transition: filter .15s ease;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:hover { filter: brightness(1.08); }
  .btn-primary { background: var(--accent); color: #fff; padding: 12px; width: 100%; }
  .btn-block { width: 100%; }

  .msg { font-size: 13px; margin: 4px 0 12px; min-height: 18px; }
  .msg.error { color: var(--danger); }

  /* ---------- app shell ---------- */
  #app-view { display: none; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .topbar .brand { font-size: 17px; }
  .who { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .role-chip {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--text);
  }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 7px 12px; font-size: 13px; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }

  .status-row {
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .status-row h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .counts { color: var(--muted); font-size: 14px; }
  .counts b { color: var(--text); }

  /* ---------- floor grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--free);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    min-height: 118px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color .15s ease, transform .08s ease;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile.busy { border-left-color: var(--busy); background: linear-gradient(180deg, rgba(245,167,66,0.07), rgba(245,167,66,0) 60%), var(--surface); }

  .tile-top { display: flex; align-items: center; justify-content: space-between; }
  .pc-code { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--free); }
  .tile.busy .status-dot { background: var(--busy); animation: pulse 2s infinite; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .tile.busy .status-dot { animation: none; } }

  .tile-state { font-size: 13px; color: var(--muted); }
  .tile.busy .customer { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .tile .timer { font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .tile.free .free-label { font-size: 13px; color: var(--free); font-weight: 600; }

  .hint { color: var(--muted); font-size: 13px; margin-top: 18px; text-align: center; }

  /* ---------- modal ---------- */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(6,8,12,0.7);
    z-index: 20;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
  }
  .modal h2 { font-family: "Space Grotesk", sans-serif; font-size: 18px; margin: 0 0 4px; }
  .modal .modal-sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .modal .row { display: flex; gap: 10px; margin-top: 8px; }
  .btn-danger { background: var(--danger); color: #fff; padding: 12px; }
  .btn-surface { background: var(--surface-2); color: var(--text); padding: 12px; }
  .pc-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
  .pc-picker button { background: var(--surface-2); color: var(--text); padding: 12px 0; font-family: "JetBrains Mono", monospace; font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); margin-top: 14px; }
  .bill-amount { font-family: "JetBrains Mono", monospace; font-size: 42px; font-weight: 700; letter-spacing: -0.02em; }

  /* ---------- tabs + history ---------- */
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; font-size: 14px; }
  .tab.active { background: var(--surface); color: var(--text); border-color: var(--accent); }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .hist-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .hist-pc { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 14px; }
  .hist-cust { font-size: 14px; margin-top: 1px; }
  .hist-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .hist-amt { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 17px; text-align: right; }
  .hist-amt .hist-min { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); vertical-align: middle; }
  .badge-cash, .badge-ok { color: var(--free); border-color: rgba(52,211,153,.4); }
  .badge-pend { color: var(--busy); border-color: rgba(245,167,66,.4); }
  .badge-rej  { color: var(--danger); border-color: rgba(240,104,95,.4); }
  .badge-unpaid { color: var(--muted); }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-view">
  <div class="login-card">
    <p class="brand">Floor<span class="dot">.</span></p>
    <p class="login-sub">Staff sign in</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
    <div id="login-msg" class="msg"></div>
    <button class="btn-primary" id="login-btn">Sign in</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-view">
  <div class="topbar">
    <p class="brand">Floor<span class="dot">.</span></p>
    <div class="who">
      <span id="who-email"></span>
      <span class="role-chip" id="who-role"></span>
      <button class="btn-ghost" id="logout-btn">Sign out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="floor">Floor</button>
      <button class="tab" data-tab="history">Recent sessions</button>
      <button class="tab" data-tab="approvals" id="tab-approvals" style="display:none;">Approvals</button>
    </div>

    <div id="floor-panel">
      <div class="status-row">
        <h1>Floor</h1>
        <span class="counts" id="counts"></span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="hint" id="hint"></p>
    </div>

    <div id="history-panel" style="display:none;">
      <div class="status-row">
        <h1>Recent sessions</h1>
        <span class="counts" id="hist-meta"></span>
      </div>
      <div class="history-list" id="history-list"></div>
      <p class="hint" id="hist-hint"></p>
    </div>

    <div id="approvals-panel" style="display:none;">
      <div class="status-row">
        <h1>UPI approvals</h1>
        <span class="counts" id="appr-meta"></span>
      </div>
      <div class="history-list" id="approvals-list"></div>
      <p class="hint" id="appr-hint"></p>
    </div>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"><!-- filled by JS --></div>
</div>

<!-- Supabase client library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CONFIG  —  these two values connect this page to YOUR
   database. The publishable key is safe to ship in the
   browser; Row Level Security is what actually protects the
   data (only logged-in staff can read/write).
   ========================================================= */
const SUPABASE_URL = "https://tknwackkxdnirvyinmpk.supabase.co";
const SUPABASE_KEY = "sb_publishable_mhIpGIYVShJV55huBVPvZQ_7rtX6AmH";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- element refs ---------- */
const loginView = document.getElementById("login-view");
const appView   = document.getElementById("app-view");
const loginMsg  = document.getElementById("login-msg");
const grid      = document.getElementById("grid");
const overlay   = document.getElementById("overlay");
const modal     = document.getElementById("modal");

/* in-memory picture of the floor */
let pcs = [];          // [{id, code}]
let busyByPc = {};     // pc_id -> {session_id, customer, sessionStart(Date)}
let currentRole = null;
let cafeUpiId = null;

/* =========================================================
   AUTH
   ========================================================= */
document.getElementById("login-btn").addEventListener("click", signIn);
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") signIn(); });
document.getElementById("logout-btn").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

async function signIn() {
  loginMsg.textContent = "";
  loginMsg.className = "msg";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) { showLoginError("Enter your email and password."); return; }

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { showLoginError(error.message); return; }
  await startApp();
}

function showLoginError(text) {
  loginMsg.textContent = text;
  loginMsg.className = "msg error";
}

/* On page load, resume an existing session if there is one */
(async function boot() {
  const { data } = await sb.auth.getSession();
  if (data.session) await startApp();
})();

/* =========================================================
   APP START  —  learn who is logged in, then draw the floor
   ========================================================= */
async function startApp() {
  const { data: { user } } = await sb.auth.getUser();

  // read this staff member's role (RLS lets you read only your own row)
  const { data: staff } = await sb.from("staff").select("role").eq("id", user.id).single();
  currentRole = staff ? staff.role : null;
  document.getElementById("who-email").textContent = user.email;
  document.getElementById("who-role").textContent = currentRole || "—";

  // owner-only: reveal the Approvals tab
  if (currentRole === "owner") document.getElementById("tab-approvals").style.display = "";

  // load café settings (the UPI ID customers pay into)
  const { data: cfg } = await sb.from("settings").select("upi_id").eq("id", 1).single();
  cafeUpiId = cfg ? cfg.upi_id : null;

  loginView.style.display = "none";
  appView.style.display = "block";
  setupTabs();

  await loadFloor();
  // refresh from the database every 5s so multiple devices stay in sync
  setInterval(() => { if (!overlay.classList.contains("open")) loadFloor(); }, 5000);
  // tick the visible timers every second (no database call)
  setInterval(tickTimers, 1000);
}

/* =========================================================
   LOAD FLOOR  —  busy/free is COMPUTED, never stored:
   a PC is busy if it has an OPEN segment (ended_at is null).
   ========================================================= */
async function loadFloor() {
  // 1. the machine roster
  const { data: pcData, error: pcErr } = await sb
    .from("pcs").select("id, code").eq("is_active", true).order("code");
  if (pcErr) { console.error(pcErr); return; }
  pcs = pcData;

  // 2. every OPEN segment + its session details
  const { data: segs, error: segErr } = await sb
    .from("session_segments")
    .select("pc_id, session_id, sessions ( customer_type, customer_name, started_at )")
    .is("ended_at", null);
  if (segErr) { console.error(segErr); return; }

  // 3. build the busy map
  busyByPc = {};
  segs.forEach(s => {
    const name = s.sessions.customer_name || (s.sessions.customer_type === "member" ? "Member" : "Walk-in");
    busyByPc[s.pc_id] = {
      session_id: s.session_id,
      customer: name,
      sessionStart: new Date(s.sessions.started_at),
    };
  });

  render();
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const busyCount = Object.keys(busyByPc).length;
  const freeCount = pcs.length - busyCount;
  document.getElementById("counts").innerHTML =
    `<b>${freeCount}</b> free · <b>${busyCount}</b> in use`;
  document.getElementById("hint").textContent =
    busyCount === 0 ? "All machines free. Tap a machine to start a session." : "";

  grid.innerHTML = "";
  pcs.forEach(pc => {
    const busy = busyByPc[pc.id];
    const tile = document.createElement("button");
    tile.className = "tile " + (busy ? "busy" : "free");

    if (busy) {
      tile.innerHTML = `
        <div class="tile-top">
          <span class="pc-code">${pc.code}</span>
          <span class="status-dot"></span>
        </div>
        <div>
          <div class="customer">${escapeHtml(busy.customer)}</div>
          <div class="timer" data-start="${busy.sessionStart.getTime()}">00:00:00</div>
        </div>`;
      tile.addEventListener("click", () => openBusyModal(pc));
    } else {
      tile.innerHTML = `
        <div class="tile-top">
          <span class="pc-code">${pc.code}</span>
          <span class="status-dot"></span>
        </div>
        <div class="free-label">Free</div>`;
      tile.addEventListener("click", () => openFreeModal(pc));
    }
    grid.appendChild(tile);
  });
  tickTimers();
}

/* update the HH:MM:SS text on each busy tile */
function tickTimers() {
  document.querySelectorAll(".timer").forEach(el => {
    const start = Number(el.getAttribute("data-start"));
    el.textContent = formatDuration(Date.now() - start);
  });
}

function formatDuration(ms) {
  const total = Math.floor(ms / 1000);
  const h = String(Math.floor(total / 3600)).padStart(2, "0");
  const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
  const s = String(total % 60).padStart(2, "0");
  return `${h}:${m}:${s}`;
}

/* =========================================================
   START A SESSION (click a free machine)
   ========================================================= */
function openFreeModal(pc) {
  modal.innerHTML = `
    <h2>Start session · ${pc.code}</h2>
    <p class="modal-sub">Walk-in customer</p>
    <label for="cust">Name (optional)</label>
    <input id="cust" type="text" placeholder="e.g. Rahul" />
    <div id="modal-msg" class="msg"></div>
    <div class="row">
      <button class="btn-surface btn-block" data-close>Cancel</button>
      <button class="btn-primary btn-block" id="confirm-start">Start</button>
    </div>
    <p class="note">Members will be added in the next build step.</p>`;
  openOverlay();
  document.getElementById("confirm-start").addEventListener("click", () => startSession(pc));
  document.getElementById("cust").focus();
}

async function startSession(pc) {
  const name = document.getElementById("cust").value.trim();
  const mmsg = document.getElementById("modal-msg");
  mmsg.textContent = "Starting…"; mmsg.className = "msg";

  // 1. create the visit (session)
  const { data: session, error: sErr } = await sb
    .from("sessions")
    .insert({ customer_type: "walkin", customer_name: name || null })
    .select("id").single();
  if (sErr) { mmsg.textContent = sErr.message; mmsg.className = "msg error"; return; }

  // 2. open a segment on this PC. The DB's unique rule blocks a second
  //    open segment on one PC, so if two people grab it at once, one fails.
  const { error: segErr } = await sb
    .from("session_segments")
    .insert({ session_id: session.id, pc_id: pc.id });

  if (segErr) {
    // roll the empty session back so we don't leave an orphan
    await sb.from("sessions").update({ ended_at: new Date().toISOString() }).eq("id", session.id);
    mmsg.textContent = "That machine just became busy. Refreshing…";
    mmsg.className = "msg error";
    await loadFloor();
    return;
  }
  closeOverlay();
  await loadFloor();
}

/* =========================================================
   BUSY MACHINE (click it): move the customer, or end.
   ========================================================= */
function openBusyModal(pc) {
  const info = busyByPc[pc.id];
  if (!info) { loadFloor(); return; }
  modal.innerHTML = `
    <h2>${pc.code} · ${escapeHtml(info.customer)}</h2>
    <p class="modal-sub mono" id="modal-timer">${formatDuration(Date.now() - info.sessionStart.getTime())}</p>
    <div id="modal-msg" class="msg"></div>
    <button class="btn-surface btn-block" id="move-btn" style="margin-bottom:10px;">Move to another machine</button>
    <div id="move-picker"></div>
    <button class="btn-danger btn-block" id="end-btn">End session</button>
    <div class="row" style="margin-top:12px;">
      <button class="btn-ghost btn-block" data-close>Close</button>
    </div>`;
  openOverlay();

  // keep the modal timer ticking too
  const t = setInterval(() => {
    const el = document.getElementById("modal-timer");
    if (!el) { clearInterval(t); return; }
    el.textContent = formatDuration(Date.now() - info.sessionStart.getTime());
  }, 1000);

  document.getElementById("end-btn").addEventListener("click", () => endSession(info.session_id));
  document.getElementById("move-btn").addEventListener("click", () => showMovePicker(pc, info.session_id));
}

function showMovePicker(fromPc, sessionId) {
  const freePcs = pcs.filter(p => !busyByPc[p.id]);
  const picker = document.getElementById("move-picker");
  if (freePcs.length === 0) {
    picker.innerHTML = `<p class="note">No free machines to move to.</p>`;
    return;
  }
  picker.innerHTML = `
    <p class="note" style="margin-top:0">Move to:</p>
    <div class="pc-picker">
      ${freePcs.map(p => `<button data-move="${p.id}">${p.code}</button>`).join("")}
    </div>`;
  picker.querySelectorAll("[data-move]").forEach(btn => {
    btn.addEventListener("click", () => moveSession(sessionId, Number(btn.getAttribute("data-move"))));
  });
}

async function moveSession(sessionId, toPcId) {
  const mmsg = document.getElementById("modal-msg");
  mmsg.textContent = "Moving…"; mmsg.className = "msg";
  const now = new Date().toISOString();

  // 1. close the current open segment (the stretch on the old PC)
  const { error: closeErr } = await sb
    .from("session_segments").update({ ended_at: now })
    .eq("session_id", sessionId).is("ended_at", null);
  if (closeErr) { mmsg.textContent = closeErr.message; mmsg.className = "msg error"; return; }

  // 2. open a new segment on the new PC — same session, so the visit continues
  const { error: openErr } = await sb
    .from("session_segments").insert({ session_id: sessionId, pc_id: toPcId });
  if (openErr) {
    mmsg.textContent = "That machine just became busy. Refreshing…";
    mmsg.className = "msg error";
    await loadFloor();
    return;
  }
  closeOverlay();
  await loadFloor();
}

async function endSession(sessionId) {
  const mmsg = document.getElementById("modal-msg");
  mmsg.textContent = "Ending…"; mmsg.className = "msg";

  // Billing runs on the SERVER. We just ask to end the session; the
  // database computes minutes, applies the discount, stores the amount.
  const { data, error } = await sb.rpc("end_session", { p_session_id: sessionId });
  if (error) { mmsg.textContent = error.message; mmsg.className = "msg error"; return; }

  await loadFloor();

  const r = data && data[0];
  const amount = r ? r.amount : null;

  if (amount === null || amount === undefined) {
    closeOverlay();          // member: no per-visit charge (wallet handled later)
  } else if (Number(amount) <= 0) {
    showNoCharge(r);         // 0-minute session: nothing to collect
  } else {
    showBill(sessionId, r);  // walk-in with a charge: collect payment
  }
}

function showNoCharge(r) {
  modal.innerHTML = `
    <h2>Session ended</h2>
    <p class="modal-sub">No charge</p>
    <p class="note" style="margin-top:2px">${r.total_minutes} min played</p>
    <button class="btn-primary btn-block" data-close style="margin-top:18px;">Done</button>`;
  openOverlay();
}

/* Step 1: show the bill and how to settle it */
function showBill(sessionId, r) {
  modal.innerHTML = `
    <h2>Session ended</h2>
    <p class="modal-sub">Amount to collect</p>
    <div class="bill-amount">₹${Number(r.amount).toFixed(2)}</div>
    <p class="note" style="margin-top:2px">
      ${r.total_minutes} min played · ${r.chargeable_minutes} charged · ${r.discount_minutes} free
    </p>
    <div id="modal-msg" class="msg" style="margin-top:8px"></div>
    <p class="note" style="margin-top:2px">How did they pay?</p>
    <div class="row">
      <button class="btn-surface btn-block" id="pay-cash">Cash</button>
      <button class="btn-primary btn-block" id="pay-upi">UPI</button>
    </div>
    <button class="btn-ghost btn-block" data-close style="margin-top:10px;">Skip for now</button>`;
  openOverlay();
  document.getElementById("pay-cash").addEventListener("click", () => recordPayment(sessionId, "cash"));
  document.getElementById("pay-upi").addEventListener("click", () => showUpiForm(sessionId, r));
}

/* Step 2 (UPI only): show where to pay + capture the reference */
function showUpiForm(sessionId, r) {
  const upiLine = cafeUpiId
    ? `Customer pays to <b>${escapeHtml(cafeUpiId)}</b>`
    : `<span style="color:var(--busy)">Set your UPI ID in the settings table first.</span>`;
  modal.innerHTML = `
    <h2>UPI · ₹${Number(r.amount).toFixed(2)}</h2>
    <p class="modal-sub">${upiLine}</p>
    <label for="upi-ref">UPI reference / UTR</label>
    <input id="upi-ref" type="text" placeholder="e.g. 4417xxxxxx" />
    <div id="modal-msg" class="msg"></div>
    <div class="row">
      <button class="btn-surface btn-block" data-close>Cancel</button>
      <button class="btn-primary btn-block" id="upi-confirm">Record UPI</button>
    </div>
    <p class="note">Recorded as pending until the owner confirms it in his UPI account.</p>`;
  openOverlay();
  document.getElementById("upi-ref").focus();
  document.getElementById("upi-confirm").addEventListener("click", () =>
    recordPayment(sessionId, "upi", document.getElementById("upi-ref").value.trim()));
}

/* send to the server (cash = settled, upi = pending) */
async function recordPayment(sessionId, method, reference) {
  const mmsg = document.getElementById("modal-msg");
  if (mmsg) { mmsg.textContent = "Recording…"; mmsg.className = "msg"; }
  const { error } = await sb.rpc("record_payment", {
    p_session_id: sessionId, p_method: method, p_reference: reference || null
  });
  if (error) { if (mmsg) { mmsg.textContent = error.message; mmsg.className = "msg error"; } return; }
  showPaid(method);
}

function showPaid(method) {
  const label = method === "cash" ? "Cash received" : "UPI recorded · pending owner approval";
  modal.innerHTML = `
    <h2>Payment recorded</h2>
    <p class="modal-sub">${label}</p>
    <button class="btn-primary btn-block" data-close style="margin-top:14px;">Done</button>`;
  openOverlay();
}

/* =========================================================
   modal open/close helpers
   ========================================================= */
function openOverlay() { overlay.classList.add("open"); }
function closeOverlay() { overlay.classList.remove("open"); }
overlay.addEventListener("click", e => {
  if (e.target === overlay || e.target.hasAttribute("data-close")) closeOverlay();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeOverlay(); });

/* =========================================================
   TABS + RECENT SESSIONS (history)
   The history is already in the sessions table — this just
   reads it back so a cashier who missed a bill can find it.
   ========================================================= */
function setupTabs() {
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const which = tab.getAttribute("data-tab");
      document.getElementById("floor-panel").style.display     = which === "floor"     ? "block" : "none";
      document.getElementById("history-panel").style.display   = which === "history"   ? "block" : "none";
      document.getElementById("approvals-panel").style.display = which === "approvals" ? "block" : "none";
      if (which === "history")   loadHistory();
      if (which === "approvals") loadApprovals();
    });
  });
}

async function loadHistory() {
  const list = document.getElementById("history-list");
  const meta = document.getElementById("hist-meta");
  const hint = document.getElementById("hist-hint");
  list.innerHTML = ""; meta.textContent = ""; hint.textContent = "Loading…";

  // map PC id -> code, so we can show which machine(s) a visit used
  const pcCodeById = {};
  pcs.forEach(p => pcCodeById[p.id] = p.code);

  const { data, error } = await sb
    .from("sessions")
    .select("id, customer_type, customer_name, ended_at, total_minutes, chargeable_minutes, discount_minutes, amount, session_segments ( pc_id, started_at ), payments ( method, status )")
    .not("ended_at", "is", null)
    .order("ended_at", { ascending: false })
    .limit(40);

  if (error) { hint.textContent = error.message; return; }
  if (!data.length) { hint.textContent = "No sessions yet."; return; }
  hint.textContent = "";
  meta.innerHTML = `last <b>${data.length}</b>`;

  list.innerHTML = data.map(r => {
    const segs = (r.session_segments || []).slice()
      .sort((a, b) => new Date(a.started_at) - new Date(b.started_at));
    const codes = [...new Set(segs.map(s => pcCodeById[s.pc_id]).filter(Boolean))];
    const pcLabel  = codes.length ? codes.join(" → ") : "—";
    const isMember = r.customer_type === "member";
    const customer = r.customer_name || (isMember ? "Member" : "Walk-in");
    const amountText = (r.amount === null || r.amount === undefined) ? "—" : "₹" + Number(r.amount).toFixed(2);
    const freeBit = (r.discount_minutes > 0) ? ` (${r.discount_minutes} free)` : "";
    const sub = isMember
      ? `${fmtWhen(r.ended_at)} · ${r.total_minutes ?? 0} min · member`
      : `${fmtWhen(r.ended_at)} · ${r.total_minutes ?? 0} min${freeBit}`;
    const amtSub = isMember ? "" : `<span class="hist-min">${r.chargeable_minutes ?? 0} charged</span>`;
    const pay = (r.payments && r.payments[0]) || null;
    const payBadge = paymentBadge(pay, isMember, r.amount);
    return `
      <div class="hist-row">
        <div>
          <div class="hist-pc">${escapeHtml(pcLabel)} ${payBadge}</div>
          <div class="hist-cust">${escapeHtml(customer)}</div>
          <div class="hist-sub">${escapeHtml(sub)}</div>
        </div>
        <div class="hist-amt">${amountText}${amtSub}</div>
      </div>`;
  }).join("");
}

function fmtWhen(iso) {
  return new Date(iso).toLocaleString([], { day: "2-digit", month: "short", hour: "numeric", minute: "2-digit" });
}

/* small coloured tag showing how a session was paid */
function paymentBadge(pay, isMember, amount) {
  if (isMember) return "";
  if (amount !== null && Number(amount) <= 0) return "";
  if (!pay) return `<span class="badge badge-unpaid">unpaid</span>`;
  if (pay.method === "cash") return `<span class="badge badge-cash">cash</span>`;
  if (pay.status === "approved") return `<span class="badge badge-ok">UPI ✓</span>`;
  if (pay.status === "rejected") return `<span class="badge badge-rej">UPI ✕</span>`;
  return `<span class="badge badge-pend">UPI ⏳</span>`;
}

/* =========================================================
   APPROVALS (owner only): pending UPI payments to confirm
   against the real bank account.
   ========================================================= */
async function loadApprovals() {
  const list = document.getElementById("approvals-list");
  const meta = document.getElementById("appr-meta");
  const hint = document.getElementById("appr-hint");
  list.innerHTML = ""; meta.textContent = ""; hint.textContent = "Loading…";

  const { data, error } = await sb
    .from("payments")
    .select("id, amount, reference, created_at, sessions ( customer_name )")
    .eq("method", "upi").eq("status", "pending")
    .order("created_at", { ascending: false });

  if (error) { hint.textContent = error.message; return; }
  if (!data.length) { hint.textContent = "No UPI payments waiting for approval."; return; }
  hint.textContent = "";
  meta.innerHTML = `<b>${data.length}</b> pending`;

  list.innerHTML = data.map(p => {
    const who = (p.sessions && p.sessions.customer_name) || "Walk-in";
    return `
      <div class="hist-row">
        <div>
          <div class="hist-cust">₹${Number(p.amount).toFixed(2)} · ${escapeHtml(who)}</div>
          <div class="hist-sub">Ref ${escapeHtml(p.reference || "—")} · ${fmtWhen(p.created_at)}</div>
        </div>
        <div class="row" style="margin:0;">
          <button class="btn-surface" data-reject="${p.id}">Reject</button>
          <button class="btn-primary" data-approve="${p.id}">Approve</button>
        </div>
      </div>`;
  }).join("");

  list.querySelectorAll("[data-approve]").forEach(b =>
    b.addEventListener("click", () => decidePayment(Number(b.getAttribute("data-approve")), true)));
  list.querySelectorAll("[data-reject]").forEach(b =>
    b.addEventListener("click", () => decidePayment(Number(b.getAttribute("data-reject")), false)));
}

async function decidePayment(paymentId, approve) {
  const { error } = await sb.rpc("approve_payment", { p_payment_id: paymentId, p_approve: approve });
  if (error) { alert(error.message); return; }
  loadApprovals();
}

/* tiny helper: keep typed names safe to drop into HTML */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
